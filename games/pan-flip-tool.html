<body>

<!-- ── 헤더 ── -->
<div class="tool-header">
  <a href="pan-flip.html" class="back-link">← 게임 설명</a>
  <span class="header-title">⏱️ 판 뒤집기 타이머·점수판</span>
  <span class="round-badge">라운드 <b id="roundNum">1</b>/<b id="roundTotal">3</b></span>
</div>

<!-- ══════════ 설정 화면 ══════════ -->
<div class="screen active" id="setupScreen">
  <div class="wrap">
    <div class="setup-title">⏱️ 라운드 시간</div>
    <div class="opt-row" data-cfg="sec">
      <button class="opt-btn" data-v="30">30초</button>
      <button class="opt-btn active" data-v="45">45초</button>
      <button class="opt-btn" data-v="60">60초</button>
      <button class="opt-btn" data-v="90">90초</button>
    </div>
    <div class="setup-title">🏆 라운드 수</div>
    <div class="opt-row" data-cfg="rounds">
      <button class="opt-btn" data-v="1">단판</button>
      <button class="opt-btn active" data-v="3">3라운드</button>
      <button class="opt-btn" data-v="5">5라운드</button>
    </div>
    <button class="start-btn" onclick="startGame()">🔴🔵 게임 시작!</button>
  </div>
</div>

<!-- ══════════ 플레이 화면 ══════════ -->
<div class="screen" id="playScreen">

  <div class="score-strip">
    <span class="strip-team red">🔴 빨강</span>
    <span class="strip-num" id="winRed" style="color:#f87171;">0</span>
    <span class="strip-vs">승부</span>
    <span class="strip-num" id="winBlue" style="color:#60a5fa;">0</span>
    <span class="strip-team blue">파랑 🔵</span>
  </div>

  <div class="timer-area">
    <div class="timer-num" id="timerNum">45</div>
    <div class="timer-sub" id="timerSub">시작 버튼을 누르면 카운트다운!</div>
  </div>

  <div class="timer-controls" id="timerControls">
    <button class="t-btn t-start" id="startPauseBtn" onclick="toggleTimer()">▶ 라운드 시작</button>
    <button class="t-btn t-reset" onclick="resetTimer()">↺</button>
  </div>

  <!-- 라운드 종료 후 점수 입력 -->
  <div class="count-panel" id="countPanel">
    <div class="count-title">🔢 판 개수를 세서 입력하세요</div>
    <div class="count-grid">
      <div class="count-card red">
        <div class="cc-name">🔴 빨강팀</div>
        <div class="cc-num" id="cntRed">0</div>
        <div class="cc-label">판 개수</div>
        <div class="cc-btns">
          <button class="cc-btn" onclick="cnt('red',-1)">−</button>
          <button class="cc-btn" onclick="cnt('red',1)">+</button>
          <button class="cc-btn plus5" onclick="cnt('red',5)">+5</button>
        </div>
      </div>
      <div class="count-card blue">
        <div class="cc-name">🔵 파랑팀</div>
        <div class="cc-num" id="cntBlue">0</div>
        <div class="cc-label">판 개수</div>
        <div class="cc-btns">
          <button class="cc-btn" onclick="cnt('blue',-1)">−</button>
          <button class="cc-btn" onclick="cnt('blue',1)">+</button>
          <button class="cc-btn plus5" onclick="cnt('blue',5)">+5</button>
        </div>
      </div>
    </div>
    <button class="confirm-btn" onclick="confirmRound()">✅ 라운드 결과 확정</button>
  </div>

  <div class="history">
    <div class="history-title">라운드 기록</div>
    <div class="history-rows" id="historyRows"></div>
    <button class="ghost-btn" onclick="location.reload()">🔄 처음부터 다시</button>
  </div>
</div>

<!-- ── 최종 결과 ── -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">빨강팀 승리!</div>
    <div class="result-sub" id="resultSub"></div>
    <button class="result-btn" onclick="location.reload()">🔄 새 게임 시작</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

let audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function whistle() {
  // 종료 휘슬: 높은 음 3연타
  beep(1800, 0.35, 'square', 0.25);
  setTimeout(() => beep(1800, 0.35, 'square', 0.25), 400);
  setTimeout(() => beep(2200, 0.6, 'square', 0.28), 800);
}

/* ── 설정 ── */
let CFG = { sec: 45, rounds: 3 };
document.querySelectorAll('.opt-row[data-cfg]').forEach(row => {
  row.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      row.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      CFG[row.dataset.cfg] = parseInt(btn.dataset.v, 10);
    });
  });
});

/* ── 상태 ── */
let S = {
  round: 1,
  remainMs: 0,
  running: false,
  timerId: null,
  lastTick: 0,
  winRed: 0,
  winBlue: 0,
  cntRed: 0,
  cntBlue: 0,
  history: []
};

async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}

function startGame() {
  S.round = 1;
  S.winRed = 0; S.winBlue = 0;
  S.history = [];
  $('roundTotal').textContent = CFG.rounds;
  $('historyRows').innerHTML = '';
  updateStrip();
  resetTimer();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('playScreen').classList.add('active');
  keepAwake();
}

/* ── 타이머 ── */
function resetTimer() {
  stopTick();
  S.running = false;
  S.remainMs = CFG.sec * 1000;
  renderTimer();
  $('startPauseBtn').textContent = '▶ 라운드 시작';
  $('startPauseBtn').className = 't-btn t-start';
  $('timerSub').textContent = '시작 버튼을 누르면 카운트다운!';
  $('countPanel').classList.remove('show');
  $('timerControls').style.display = 'flex';
}

function toggleTimer() {
  if (S.running) {
    S.running = false;
    stopTick();
    $('startPauseBtn').textContent = '▶ 재개';
    $('startPauseBtn').className = 't-btn t-start';
    $('timerSub').textContent = '일시정지 중';
  } else {
    S.running = true;
    S.lastTick = performance.now();
    S.timerId = setInterval(tick, 100);
    $('startPauseBtn').textContent = '⏸ 일시정지';
    $('startPauseBtn').className = 't-btn t-pause';
    $('timerSub').textContent = '뒤집어라!!! 🔥';
    beep(660, 0.15); setTimeout(() => beep(880, 0.25), 160);
  }
}

function stopTick() {
  if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
}

let lastWholeSec = null;
function tick() {
  const now = performance.now();
  const dt = now - S.lastTick;
  S.lastTick = now;
  S.remainMs -= dt;

  if (S.remainMs <= 0) {
    S.remainMs = 0;
    S.running = false;
    stopTick();
    renderTimer();
    roundEnd();
    return;
  }
  renderTimer();

  // 마지막 5초 비프
  const whole = Math.ceil(S.remainMs / 1000);
  if (whole !== lastWholeSec) {
    lastWholeSec = whole;
    if (whole <= 5) { beep(1000, 0.12, 'square', 0.22); vibrate(30); }
  }
}

function renderTimer() {
  const whole = Math.ceil(S.remainMs / 1000);
  const el = $('timerNum');
  el.textContent = whole;
  el.classList.remove('warn', 'danger');
  if (whole <= 5) el.classList.add('danger');
  else if (whole <= 10) el.classList.add('warn');
}

/* ── 라운드 종료 → 점수 입력 ── */
function roundEnd() {
  whistle();
  vibrate([100, 80, 100, 80, 200]);
  $('timerSub').textContent = '⏹ 라운드 종료! 모두 손 떼세요!';
  S.cntRed = 0; S.cntBlue = 0;
  $('cntRed').textContent = 0;
  $('cntBlue').textContent = 0;
  $('timerControls').style.display = 'none';
  $('countPanel').classList.add('show');
}

function cnt(team, d) {
  if (team === 'red') {
    S.cntRed = Math.max(0, S.cntRed + d);
    $('cntRed').textContent = S.cntRed;
  } else {
    S.cntBlue = Math.max(0, S.cntBlue + d);
    $('cntBlue').textContent = S.cntBlue;
  }
  vibrate(15);
}

function confirmRound() {
  const win = S.cntRed > S.cntBlue ? 'red' : S.cntBlue > S.cntRed ? 'blue' : 'tie';
  if (win === 'red') S.winRed++;
  else if (win === 'blue') S.winBlue++;
  S.history.push({ round: S.round, red: S.cntRed, blue: S.cntBlue, win });

  const row = document.createElement('div');
  row.className = 'h-row';
  row.innerHTML =
    '<span class="h-round">R' + S.round + '</span>' +
    '<span class="h-red">🔴 ' + S.cntRed + '</span>' +
    '<span style="color:#475569;">:</span>' +
    '<span class="h-blue">' + S.cntBlue + ' 🔵</span>' +
    '<span class="h-win">' + (win === 'red' ? '🔴 승' : win === 'blue' ? '🔵 승' : '무승부') + '</span>';
  $('historyRows').appendChild(row);

  updateStrip();

  // 승부 결정 or 다음 라운드
  const need = Math.floor(CFG.rounds / 2) + 1;
  if (S.winRed >= need || S.winBlue >= need || S.round >= CFG.rounds) {
    showFinal();
  } else {
    S.round++;
    $('roundNum').textContent = S.round;
    resetTimer();
    $('timerSub').textContent = '라운드 ' + S.round + ' 준비! 판을 반반으로 다시 섞으세요';
  }
}

function updateStrip() {
  $('winRed').textContent = S.winRed;
  $('winBlue').textContent = S.winBlue;
}

function showFinal() {
  const t = $('resultTitle');
  if (S.winRed > S.winBlue) {
    $('resultEmoji').textContent = '🔴';
    t.textContent = '빨강팀 승리!';
    t.className = 'result-title red';
  } else if (S.winBlue > S.winRed) {
    $('resultEmoji').textContent = '🔵';
    t.textContent = '파랑팀 승리!';
    t.className = 'result-title blue';
  } else {
    $('resultEmoji').textContent = '🤝';
    t.textContent = '무승부!';
    t.className = 'result-title tie';
  }
  $('resultSub').textContent = '라운드 스코어 ' + S.winRed + ' : ' + S.winBlue +
    ' · 총 판 수 ' + S.history.reduce((a, h) => a + h.red, 0) + ' : ' + S.history.reduce((a, h) => a + h.blue, 0);
  $('resultOverlay').classList.add('show');
  beep(523, 0.2); setTimeout(() => beep(659, 0.2), 220); setTimeout(() => beep(784, 0.2), 440); setTimeout(() => beep(1047, 0.5), 660);
}
</script>
</body>
</html>
